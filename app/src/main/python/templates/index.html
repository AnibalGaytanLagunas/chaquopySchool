<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Flask server</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: sans-serif;
      background: #101014;
      color: #f3f3f7;
    }
    .card {
      width: min(92vw, 420px);
      padding: 1.75rem;
      border-radius: 18px;
      background: #1b1b22;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .ok {
      color: #7dff9a;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    h1 { margin: 0.6rem 0 0.4rem; font-size: 1.8rem; }
    p { margin: 0.35rem 0; color: #c9c9d4; }
  </style>
</head>
<body>
  <div class="card">
    <p class="ok">● flask running</p>
    <h1 id="message">server on port {{ port }}</h1>
    <p id="clock"></p>
  </div>
  <script>
    const fallbackPort = {{ port }};

    function tick() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
    }

    async function refresh() {
      try {
        const response = await fetch("/status");
        const data = await response.json();
        document.getElementById("message").textContent = "server on port " + data.port;
      } catch (error) {
        document.getElementById("message").textContent = "server on port " + fallbackPort;
      }
    }

    tick();
    refresh();
    setInterval(tick, 1000);
    setInterval(refresh, 2000);
  </script>
</body>
</html>
